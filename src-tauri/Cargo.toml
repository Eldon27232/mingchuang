[package]
name = "mingchuang"
version = "0.0.15"
edition = "2021"
description = "整治国产流氓软件的 Windows 11 桌面治理工具"
license = "MIT"
repository = "https://github.com/Eldon27232/mingchuang"
default-run = "mingchuang"

[lib]
name = "mingchuang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 后台监控守护 binary (8 Mbps 上行报警, 独立进程)
[[bin]]
name = "mingchuang-sentry"
path = "src/sentry/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
windows-registry = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
windows-service = "0.7"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Notifications",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros"] }
include_dir = "0.7"
# Claude 链路证书监控: 直连抓取对端证书链, 用公共根独立校验 (与系统证书库无关)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
